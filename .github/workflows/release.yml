name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # For attaching the .vsix to a GitHub release.
      contents: write
    defaults:
      run:
        working-directory: vscode-zarr
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: vscode-zarr
      - uses: actions/checkout@v4
        with:
          repository: d-v-b/zarr-metadata-ts
          path: zarr-metadata-ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the zarr-metadata library
        working-directory: zarr-metadata-ts
        run: npm ci && npm run build
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npx --yes @vscode/vsce package --no-dependencies
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath *.vsix -p "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
      - name: Attach the .vsix to a GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --generate-notes

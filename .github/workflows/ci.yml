name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Activation smoke test against the built bundle
        run: node scripts/smoke.cjs
      - name: Package a .vsix (dry run of the release artifact)
        run: npx --yes @vscode/vsce package --no-dependencies
